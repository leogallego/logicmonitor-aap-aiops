---
- ansible.builtin.import_playbook: validate_lab_target.yml

- name: Simulate BGP peer down by shutting interface
  hosts: "{{ target_host | default('router2') }}"
  gather_facts: false

  vars:
    target_interface: "{{ interface | default('Ethernet1') }}"

  tasks:
    - name: Show BGP state before disruption
      arista.eos.eos_command:
        commands:
          - show ip bgp summary
      register: __bgp_before
      changed_when: false
      tags:
        - disrupt
        - restore

    - name: Display BGP state before disruption
      ansible.builtin.debug:
        var: __bgp_before.stdout_lines[0]
        verbosity: 1
      tags:
        - disrupt

    - name: Shut down interface to break BGP peering
      arista.eos.eos_interfaces:
        config:
          - name: "{{ target_interface }}"
            enabled: false
        state: merged
      tags:
        - disrupt

    - name: Confirm interface is down
      arista.eos.eos_command:
        commands:
          - "show interfaces {{ target_interface }} status"
      register: __iface_status
      changed_when: false
      tags:
        - disrupt

    - name: Display post-disruption interface status
      ansible.builtin.debug:
        msg: >-
          Interface {{ target_interface }} shut down on {{ inventory_hostname }}.
          BGP peering should drop within hold-timer window.
        verbosity: 0
      tags:
        - disrupt

    # never: skipped unless --tags restore (untagged runs would also
    # execute restore and self-heal the disruption).
    - name: Bring interface back up
      arista.eos.eos_interfaces:
        config:
          - name: "{{ target_interface }}"
            enabled: true
        state: merged
      tags:
        - never
        - restore

    - name: Wait for BGP peers to re-establish
      arista.eos.eos_command:
        commands:
          - show ip bgp summary
      register: __bgp_after
      changed_when: false
      # Down sessions print Idle/Active/Connect. Do not match Estab — a
      # remaining mesh peer would pass while the repaired session is down.
      until: >-
        (__bgp_after.stdout[0] | default('') | length > 0)
        and ((__bgp_after.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm')) | length == 0)
      retries: 6
      delay: 5
      tags:
        - never
        - restore

    - name: Confirm BGP restored
      ansible.builtin.debug:
        msg: >-
          Interface {{ target_interface }} restored on {{ inventory_hostname }}.
          BGP peers re-established.
        verbosity: 0
      tags:
        - never
        - restore
