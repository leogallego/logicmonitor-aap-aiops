---
- ansible.builtin.import_playbook: validate_lab_target.yml

- name: Rollback configuration to resolve BGP config drift
  hosts: "{{ affected_host }}"
  gather_facts: false

  vars:
    known_good_flash_file: lm-aiops-known-good

  tasks:
    - name: Skip if root cause does not match
      ansible.builtin.meta: end_host
      when: (root_cause | default('')) != 'config_drift'

    - name: List flash files
      arista.eos.eos_command:
        commands:
          - "dir flash:"
      register: __flash
      changed_when: false

    - name: Restore running-config from simulate snapshot
      arista.eos.eos_command:
        commands:
          - command: "configure replace flash:{{ known_good_flash_file }}"
            prompt: '(\[confirm\]|\[y/N\])'
            answer: y
            newline: false
      when: known_good_flash_file in __flash.stdout[0]
      changed_when: true

    - name: Restore running-config from startup-config
      arista.eos.eos_command:
        commands:
          - command: configure replace startup-config
            prompt: '(\[confirm\]|\[y/N\])'
            answer: y
            newline: false
      when: known_good_flash_file not in __flash.stdout[0]
      changed_when: true

    - name: Warn when falling back to startup-config
      ansible.builtin.debug:
        msg: >-
          flash:{{ known_good_flash_file }} was not found.
          Restored from device startup-config (ContainerLab deploy baseline).
      when: known_good_flash_file not in __flash.stdout[0]

    - name: Wait for BGP peers to re-establish after config rollback
      arista.eos.eos_command:
        commands:
          - show ip bgp summary
      register: __bgp_after
      changed_when: false
      # Down sessions print Idle/Active/Connect. Do not match Estab — a
      # remaining mesh peer would pass while the repaired session is down.
      until: >-
        (__bgp_after.stdout[0] | default('') | length > 0)
        and ((__bgp_after.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm')) | length == 0)
      retries: 6
      delay: 5

    - name: Assert BGP peers are established
      ansible.builtin.assert:
        that:
          - __bgp_after.stdout[0] | length > 0
          - (__bgp_after.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm') | length) == 0
        fail_msg: "BGP peers did not re-establish after config rollback"
        success_msg: "BGP peers re-established after config rollback"

    - name: Set remediation result
      ansible.builtin.set_stats:
        data:
          remediation_result: "config_rollback_success"
          remediation_host: "{{ affected_host }}"
          alert_id: "{{ alert_id }}"
