---
- name: Escalate unmatched alert to Edwin AI
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Passed from the EDA catch-all rule
    # raw_alert: {}
    # source: "eda_catch_all"
    # edwin_portal / edwin_access_id / edwin_access_key from credential injectors

  tasks:
    - name: Log escalation event
      ansible.builtin.debug:
        msg: >-
          Escalating unmatched alert to Edwin AI.
          Alert type: {{ raw_alert.type | default('unknown') }}.
          Source: {{ source | default('unknown') }}.
        verbosity: 0

    - name: Query Edwin AI for correlated alerts
      logicmonitor.edwin_ai.query_api:
        portal: "{{ edwin_portal }}"
        access_id: "{{ edwin_access_id }}"
        access_key: "{{ edwin_access_key }}"
        record_type: alerts
        limit: 20
        lookback_window: 3600
      register: __edwin_alerts

    - name: Query Edwin AI for insights
      logicmonitor.edwin_ai.query_api:
        portal: "{{ edwin_portal }}"
        access_id: "{{ edwin_access_id }}"
        access_key: "{{ edwin_access_key }}"
        record_type: insights
        limit: 10
        lookback_window: 3600
      register: __edwin_insights

    - name: Set escalation artifacts for Controller and operators
      ansible.builtin.set_stats:
        data:
          escalation_result: submitted
          alert_type: "{{ raw_alert.type | default('unknown') }}"
          correlated_alert_count: "{{ __edwin_alerts.data.results | default([]) | length }}"
          insight_count: "{{ __edwin_insights.data.results | default([]) | length }}"

    - name: Display Edwin AI context
      ansible.builtin.debug:
        msg: >-
          Edwin Query API returned
          {{ __edwin_alerts.data.results | default([]) | length }} alerts and
          {{ __edwin_insights.data.results | default([]) | length }} insights.
          This job does not call AAP MCP. Point Edwin AI at the AAP MCP
          server so the agent can discover job templates. There is no
          public Edwin escalation HTTP API in this collection.
        verbosity: 0
