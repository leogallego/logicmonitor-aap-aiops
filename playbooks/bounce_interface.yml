---
- ansible.builtin.import_playbook: validate_lab_target.yml

- name: Bounce interface to resolve BGP flapping
  hosts: "{{ affected_host }}"
  gather_facts: false

  vars:
    target_interface: "{{ interface | default('Ethernet1') }}"

  tasks:
    - name: Skip if root cause does not match
      ansible.builtin.meta: end_host
      when: (root_cause | default('')) != 'interface_errors'

    - name: Shut down interface
      arista.eos.eos_interfaces:
        config:
          - name: "{{ target_interface }}"
            enabled: false
        state: merged

    - name: Wait for interface to fully go down
      ansible.builtin.pause:
        seconds: 5

    - name: Bring interface back up
      arista.eos.eos_interfaces:
        config:
          - name: "{{ target_interface }}"
            enabled: true
        state: merged

    - name: Wait for BGP peers to re-establish
      arista.eos.eos_command:
        commands:
          - show ip bgp summary
      register: __bgp_after
      changed_when: false
      # Down sessions print Idle/Active/Connect. Do not match Estab — a
      # remaining mesh peer would pass while the repaired session is down.
      until: >-
        (__bgp_after.stdout[0] | default('') | length > 0)
        and ((__bgp_after.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm')) | length == 0)
      retries: 6
      delay: 5

    - name: Assert BGP peers are established
      ansible.builtin.assert:
        that:
          - __bgp_after.stdout[0] | length > 0
          - (__bgp_after.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm') | length) == 0
        fail_msg: "BGP peers did not re-establish after interface bounce"
        success_msg: "BGP peers re-established after interface bounce"

    - name: Set remediation result
      ansible.builtin.set_stats:
        data:
          remediation_result: "interface_bounce_success"
          remediation_host: "{{ affected_host }}"
          alert_id: "{{ alert_id }}"
