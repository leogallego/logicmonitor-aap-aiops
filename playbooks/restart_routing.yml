---
- ansible.builtin.import_playbook: validate_lab_target.yml

- name: Restart routing process to resolve CPU exhaustion
  hosts: "{{ affected_host }}"
  gather_facts: false

  tasks:
    - name: Skip if root cause does not match
      ansible.builtin.meta: end_host
      when: (root_cause | default('')) != 'cpu_exhaustion'

    - name: Capture CPU and process state
      arista.eos.eos_command:
        commands:
          - show processes top once
      register: __cpu_state
      changed_when: false

    - name: Display CPU state before remediation
      ansible.builtin.debug:
        msg: "{{ __cpu_state.stdout_lines[0][:20] }}"
        verbosity: 0

    - name: Attempt soft BGP reset to reduce process load
      arista.eos.eos_command:
        commands:
          - clear ip bgp * soft
      changed_when: true

    - name: Wait for soft reset to take effect
      ansible.builtin.pause:
        seconds: 10

    - name: Check if BGP recovered after soft reset
      arista.eos.eos_command:
        commands:
          - show ip bgp summary
      register: __bgp_soft
      changed_when: false

    - name: Force hard BGP process restart if soft reset insufficient
      arista.eos.eos_command:
        commands:
          - clear ip bgp *
      changed_when: true
      when: (__bgp_soft.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm') | length) > 0

    - name: Wait for BGP peers to re-establish
      arista.eos.eos_command:
        commands:
          - show ip bgp summary
      register: __bgp_after
      changed_when: false
      # Down sessions print Idle/Active/Connect. Do not match Estab — a
      # remaining mesh peer would pass while the repaired session is down.
      until: >-
        (__bgp_after.stdout[0] | default('') | length > 0)
        and ((__bgp_after.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm')) | length == 0)
      retries: 9
      delay: 5

    - name: Assert BGP peers are established
      ansible.builtin.assert:
        that:
          - __bgp_after.stdout[0] | length > 0
          - (__bgp_after.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm') | length) == 0
        fail_msg: "BGP peers did not re-establish after routing process restart"
        success_msg: "BGP peers re-established after routing process restart"

    - name: Set remediation result
      ansible.builtin.set_stats:
        data:
          remediation_result: "routing_restart_success"
          remediation_host: "{{ affected_host }}"
          alert_id: "{{ alert_id }}"
