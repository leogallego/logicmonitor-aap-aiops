---
- ansible.builtin.import_playbook: validate_lab_target.yml

- name: Simulate BGP config drift
  hosts: "{{ target_host | default('router2') }}"
  gather_facts: false

  vars:
    # On-device snapshot. Must live on the router (not the control node):
    # simulate runs from the operator laptop; rollback runs as an AAP job.
    known_good_flash_file: lm-aiops-known-good

  tasks:
    - name: Display simulation intent
      ansible.builtin.debug:
        msg: >-
          Introducing BGP configuration drift on {{ inventory_hostname }}.
          Snapshot running-config to flash:{{ known_good_flash_file }} first,
          then change neighbor AS to cause a peering mismatch.
        verbosity: 0

    - name: Gather BGP summary before snapshot
      arista.eos.eos_command:
        commands:
          - show ip bgp summary
      register: __bgp_before
      changed_when: false

    - name: Assert BGP is healthy before taking known-good snapshot
      ansible.builtin.assert:
        that:
          - __bgp_before.stdout[0] | length > 0
          - (__bgp_before.stdout[0] | regex_findall('Idle|Active|Connect|OpenSent|OpenConfirm') | length) == 0
        fail_msg: >-
          BGP is not established. Refusing to overwrite flash:{{ known_good_flash_file }}
          with a broken running-config. Run rollback first, then simulate.
        success_msg: "BGP is established; taking known-good snapshot"

    - name: List flash files
      arista.eos.eos_command:
        commands:
          - "dir flash:"
      register: __flash
      changed_when: false

    - name: Remove previous known-good snapshot if present
      arista.eos.eos_command:
        commands:
          - command: "delete flash:{{ known_good_flash_file }}"
            prompt: '\[confirm\]'
            answer: y
            newline: false
      when: known_good_flash_file in __flash.stdout[0]
      changed_when: true

    - name: Snapshot running-config to device flash
      arista.eos.eos_command:
        commands:
          - "copy running-config flash:{{ known_good_flash_file }}"
      changed_when: true

    - name: Introduce wrong AS number for a BGP neighbor
      arista.eos.eos_bgp_global:
        config:
          as_number: "64502"
          neighbor:
            - neighbor_address: 10.1.12.1
              remote_as: 99999
        # merged: only update this neighbor. replaced would drop
        # router2's other BGP peer.
        state: merged
