---
# Bootstrap AAP Controller with LM AIOps demo objects.
#
# Controller connection (first match wins): extra vars, then env.
#   export CONTROLLER_HOST / CONTROLLER_USERNAME / CONTROLLER_PASSWORD
#   ansible-playbook lab-automation/aap_bootstrap_lm_aiops.yml
#
# Or pass a vars file (overrides env):
#   ansible-playbook lab-automation/aap_bootstrap_lm_aiops.yml \
#     -e @lab-automation/credentials.yml
#
# Full run (also creates credentials, Event Stream, workflow template):
#   ansible-playbook lab-automation/aap_bootstrap_lm_aiops.yml \
#     -e @lab-automation/credentials.yml -e full_bootstrap=true
#
# See lab-automation/credentials.yml.example for optional file-based values.

- name: Bootstrap AAP Controller for LM AIOps demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') | default('https://localhost', true) }}"
    controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') | default('admin', true) }}"
    controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') | default('', true) }}"
    controller_verify_ssl: "{{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') | default('false', true) | bool }}"
    full_bootstrap: false

    lm_aiops_org: "Network Ops"
    lm_aiops_project_name: "LM AIOps Solution Guide"
    lm_aiops_project_url: "{{ lookup('ansible.builtin.env', 'LM_AIOPS_PROJECT_URL') | default('', true) }}"
    lm_aiops_project_branch: "{{ lookup('ansible.builtin.env', 'LM_AIOPS_PROJECT_BRANCH') | default('main', true) }}"
    lm_aiops_inventory: "Network Inventory"
    lm_aiops_credential: "Workshop Credential"
    lm_aiops_ee: "{{ lookup('ansible.builtin.env', 'LM_AIOPS_EE') | default('Default execution environment', true) }}"
    workshop_ssh_user: "{{ lookup('ansible.builtin.env', 'WORKSHOP_SSH_USER') | default('admin', true) }}"
    workshop_ssh_password: "{{ lookup('ansible.builtin.env', 'WORKSHOP_SSH_PASSWORD') | default('', true) }}"
    lab_inventory_hosts:
      router1: clab-lm-aiops-bgp-router1
      router2: clab-lm-aiops-bgp-router2
      router3: clab-lm-aiops-bgp-router3
    eda_decision_environment: "{{ lookup('ansible.builtin.env', 'EDA_DECISION_ENVIRONMENT') | default('Default Decision Environment', true) }}"
    eda_controller_token_name: "{{ lookup('ansible.builtin.env', 'EDA_CONTROLLER_TOKEN_NAME') | default('', true) }}"
    eda_rulebook_name: logicmonitor_network.yml
    # token: live LM Custom HTTP (static header). hmac: validation/test_*.sh.
    eda_event_stream_auth: "{{ lookup('ansible.builtin.env', 'EDA_EVENT_STREAM_AUTH') | default('token', true) }}"
    eda_event_stream_token: "{{ lookup('ansible.builtin.env', 'EDA_EVENT_STREAM_TOKEN') | default('', true) }}"
    eda_event_stream_header: "{{ lookup('ansible.builtin.env', 'EDA_EVENT_STREAM_HEADER') | default('Authorization', true) }}"

  tasks:
    # =================================================================
    # VALIDATION
    # =================================================================

    - name: Validate Controller credentials are provided
      ansible.builtin.assert:
        that:
          - controller_host != "https://localhost"
          - controller_password | length > 0
          - lm_aiops_project_url | length > 0
          - workshop_ssh_password | length > 0
        fail_msg: >-
          Set CONTROLLER_HOST, CONTROLLER_USERNAME, CONTROLLER_PASSWORD,
          LM_AIOPS_PROJECT_URL (git URL of this repo), and
          WORKSHOP_SSH_PASSWORD, or pass -e @lab-automation/credentials.yml.

    - name: Validate full bootstrap credentials
      ansible.builtin.assert:
        that:
          - lm_company is defined and lm_company != "CHANGEME"
          - lm_bearer_token is defined and lm_bearer_token != "CHANGEME"
          - edwin_portal is defined and edwin_portal != "CHANGEME"
          - edwin_access_id is defined and edwin_access_id != "CHANGEME"
          - edwin_access_key is defined and edwin_access_key != "CHANGEME"
          - eda_controller_token_name | length > 0
          - eda_event_stream_auth in ['token', 'hmac']
          - (eda_event_stream_auth == 'token' and eda_event_stream_token is defined and eda_event_stream_token != 'CHANGEME' and eda_event_stream_token | length > 0) or (eda_event_stream_auth == 'hmac' and eda_hmac_secret is defined and eda_hmac_secret != 'CHANGEME' and eda_hmac_secret | length > 0)
        fail_msg: >-
          Full bootstrap requires LM, Edwin AI, eda_controller_token_name,
          and Event Stream auth: eda_event_stream_token when
          eda_event_stream_auth=token (default, live LM), or
          eda_hmac_secret when eda_event_stream_auth=hmac
          (validation/test_*.sh). Fill in credentials.yml.
      when: full_bootstrap | bool

    # =================================================================
    # CORE BOOTSTRAP — always runs
    # =================================================================

    # --- Organization ---
    - name: Ensure Network Ops organization exists
      ansible.controller.organization:
        name: "{{ lm_aiops_org }}"
        description: "Network Operations — LM AIOps demo"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: Ensure Controller project exists
      ansible.controller.project:
        name: "{{ lm_aiops_project_name }}"
        description: "LM AIOps solution guide playbooks and rulebook"
        organization: "{{ lm_aiops_org }}"
        scm_type: git
        scm_url: "{{ lm_aiops_project_url }}"
        scm_branch: "{{ lm_aiops_project_branch }}"
        update_project: true
        wait: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: Ensure Network Inventory exists
      ansible.controller.inventory:
        name: "{{ lm_aiops_inventory }}"
        organization: "{{ lm_aiops_org }}"
        description: "ContainerLab BGP mesh"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: Ensure lab hosts exist in Network Inventory
      ansible.controller.host:
        name: "{{ item.key }}"
        inventory: "{{ lm_aiops_inventory }}"
        enabled: true
        variables: |
          ansible_host: {{ item.value }}
          ansible_network_os: arista.eos.eos
          ansible_connection: ansible.netcommon.network_cli
          ansible_become: true
          ansible_become_method: enable
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ lab_inventory_hosts | dict2items }}"

    - name: Ensure Workshop Credential exists
      ansible.controller.credential:
        name: "{{ lm_aiops_credential }}"
        description: "Machine credential for ContainerLab EOS SSH"
        organization: "{{ lm_aiops_org }}"
        credential_type: Machine
        inputs:
          username: "{{ workshop_ssh_user }}"
          password: "{{ workshop_ssh_password }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    # --- Credential Types ---
    - name: Create LM API credential type
      ansible.controller.credential_type:
        name: "LogicMonitor API"
        kind: cloud
        inputs:
          fields:
            - id: lm_company
              label: "LM Company Name"
              type: string
            - id: lm_bearer_token
              label: "LM Bearer Token"
              type: string
              secret: true
          required:
            - lm_company
            - lm_bearer_token
        injectors:
          extra_vars:
            lm_company: !unsafe "{{ lm_company }}"
            lm_bearer_token: !unsafe "{{ lm_bearer_token }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: Create Edwin AI credential type
      ansible.controller.credential_type:
        name: "Edwin AI API"
        kind: cloud
        inputs:
          fields:
            - id: edwin_portal
              label: "Edwin AI Portal"
              type: string
            - id: edwin_access_id
              label: "Edwin AI Access ID"
              type: string
            - id: edwin_access_key
              label: "Edwin AI Access Key"
              type: string
              secret: true
          required:
            - edwin_portal
            - edwin_access_id
            - edwin_access_key
        injectors:
          extra_vars:
            edwin_portal: !unsafe "{{ edwin_portal }}"
            edwin_access_id: !unsafe "{{ edwin_access_id }}"
            edwin_access_key: !unsafe "{{ edwin_access_key }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    # --- Job Templates ---
    - name: "Job template — Reset BGP Session (Crawl)"
      ansible.controller.job_template:
        name: "Reset BGP Session"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/reset_bgp_session.yml"
        inventory: "{{ lm_aiops_inventory }}"
        execution_environment: "{{ lm_aiops_ee }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Enrich with Edwin AI (Walk)"
      ansible.controller.job_template:
        name: "Enrich with Edwin AI"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/enrich_with_edwin_ai.yml"
        inventory: "{{ lm_aiops_inventory }}"
        execution_environment: "{{ lm_aiops_ee }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Bounce Interface (Walk)"
      ansible.controller.job_template:
        name: "Bounce Interface"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/bounce_interface.yml"
        inventory: "{{ lm_aiops_inventory }}"
        execution_environment: "{{ lm_aiops_ee }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Restart Routing (Walk)"
      ansible.controller.job_template:
        name: "Restart Routing"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/restart_routing.yml"
        inventory: "{{ lm_aiops_inventory }}"
        execution_environment: "{{ lm_aiops_ee }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Rollback Config (Walk)"
      ansible.controller.job_template:
        name: "Rollback Config"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/rollback_config.yml"
        inventory: "{{ lm_aiops_inventory }}"
        execution_environment: "{{ lm_aiops_ee }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Escalate to Edwin AI (Run)"
      ansible.controller.job_template:
        name: "Escalate to Edwin AI"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/escalate_to_edwin_ai.yml"
        inventory: "{{ lm_aiops_inventory }}"
        execution_environment: "{{ lm_aiops_ee }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Report to LogicMonitor"
      ansible.controller.job_template:
        name: "Report to LogicMonitor"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/report_to_logicmonitor.yml"
        inventory: "{{ lm_aiops_inventory }}"
        execution_environment: "{{ lm_aiops_ee }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    # =================================================================
    # FULL BOOTSTRAP — only runs with -e full_bootstrap=true
    # =================================================================

    # --- Credential instances ---
    - name: "Create LM API credential"
      ansible.controller.credential:
        name: "LogicMonitor API"
        organization: "{{ lm_aiops_org }}"
        credential_type: "LogicMonitor API"
        inputs:
          lm_company: "{{ lm_company }}"
          lm_bearer_token: "{{ lm_bearer_token }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Create Edwin AI credential"
      ansible.controller.credential:
        name: "Edwin AI API"
        organization: "{{ lm_aiops_org }}"
        credential_type: "Edwin AI API"
        inputs:
          edwin_portal: "{{ edwin_portal }}"
          edwin_access_id: "{{ edwin_access_id }}"
          edwin_access_key: "{{ edwin_access_key }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    # --- Attach Edwin AI credential to templates that need it ---
    - name: "Attach Edwin AI credential to Enrich with Edwin AI"
      ansible.controller.job_template:
        name: "Enrich with Edwin AI"
        organization: "{{ lm_aiops_org }}"
        credentials:
          - "{{ lm_aiops_credential }}"
          - "Edwin AI API"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Attach Edwin AI credential to Escalate to Edwin AI"
      ansible.controller.job_template:
        name: "Escalate to Edwin AI"
        organization: "{{ lm_aiops_org }}"
        credentials:
          - "{{ lm_aiops_credential }}"
          - "Edwin AI API"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Attach LM API credential to Reset BGP Session"
      ansible.controller.job_template:
        name: "Reset BGP Session"
        organization: "{{ lm_aiops_org }}"
        credentials:
          - "{{ lm_aiops_credential }}"
          - "LogicMonitor API"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    # --- Attach LM API credential to Report to LogicMonitor ---
    - name: "Attach LM API credential to Report to LogicMonitor"
      ansible.controller.job_template:
        name: "Report to LogicMonitor"
        organization: "{{ lm_aiops_org }}"
        credentials:
          - "{{ lm_aiops_credential }}"
          - "LogicMonitor API"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    # --- EDA Event Stream ---
    - name: Create EDA Token credential for live LogicMonitor webhooks
      ansible.eda.credential:
        name: "LM Webhook Token"
        credential_type_name: "Token Event Stream"
        organization_name: "{{ lm_aiops_org }}"
        inputs:
          token: "{{ eda_event_stream_token }}"
          http_header_key: "{{ eda_event_stream_header }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when:
        - full_bootstrap | bool
        - eda_event_stream_auth == 'token'

    - name: Create EDA HMAC credential for synthetic webhook tests
      ansible.eda.credential:
        name: "LM Webhook HMAC"
        credential_type_name: "HMAC Event Stream"
        organization_name: "{{ lm_aiops_org }}"
        inputs:
          secret: "{{ eda_hmac_secret }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when:
        - full_bootstrap | bool
        - eda_event_stream_auth == 'hmac'

    - name: "Create LogicMonitor Alerts Event Stream"
      ansible.eda.event_stream:
        name: "LogicMonitor Alerts"
        credential_name: "{{ 'LM Webhook HMAC' if eda_event_stream_auth == 'hmac' else 'LM Webhook Token' }}"
        organization_name: "{{ lm_aiops_org }}"
        forward_events: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      register: __event_stream
      when: full_bootstrap | bool

    - name: Display Event Stream webhook hint for LogicMonitor
      ansible.builtin.debug:
        msg: >-
          Event Stream 'LogicMonitor Alerts' is present
          (id {{ __event_stream.id | default('unknown') }}).
          Copy its URL from the EDA Controller UI (the module does not
          return a url field). Auth is {{ eda_event_stream_auth }}.
          Token: put eda_event_stream_token in a static LM header.
          HMAC: use eda_hmac_secret only with validation/test_*.sh.
        verbosity: 0
      when: full_bootstrap | bool

    - name: Ensure EDA project exists
      ansible.eda.project:
        name: "{{ lm_aiops_project_name }}"
        description: "LM AIOps rulebook"
        url: "{{ lm_aiops_project_url }}"
        scm_branch: "{{ lm_aiops_project_branch }}"
        organization_name: "{{ lm_aiops_org }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: Ensure LogicMonitor rulebook activation exists
      ansible.eda.rulebook_activation:
        name: "LogicMonitor Network Remediation"
        description: "Crawl / Walk / Run for LogicMonitor alerts"
        project_name: "{{ lm_aiops_project_name }}"
        rulebook_name: "{{ eda_rulebook_name }}"
        decision_environment_name: "{{ eda_decision_environment }}"
        organization_name: "{{ lm_aiops_org }}"
        awx_token_name: "{{ eda_controller_token_name }}"
        event_streams:
          - event_stream: "LogicMonitor Alerts"
            source_name: logicmonitor
        restart_policy: on-failure
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    # --- Walk: BGP Smart Remediation workflow ---
    # Create every node first, then add edges. Linking to a missing
    # identifier fails. success_nodes / failure_nodes are identifier
    # strings, not dicts.
    # Success path is sequential so Report cannot start after the first
    # skipped sibling: enrich -> bounce -> restart -> rollback -> report.
    # Enrich failure -> default_reset -> report. Report uses ANY
    # convergence (do not set all_parents_must_converge: true — rollback
    # and default_reset never both run). Each remediation still skips
    # when root_cause does not match.
    - name: Build BGP Smart Remediation workflow
      when: full_bootstrap | bool
      module_defaults:
        ansible.controller.workflow_job_template:
          organization: "{{ lm_aiops_org }}"
          controller_host: "{{ controller_host }}"
          controller_username: "{{ controller_username }}"
          controller_password: "{{ controller_password }}"
          validate_certs: "{{ controller_verify_ssl }}"
        ansible.controller.workflow_job_template_node:
          workflow_job_template: "BGP Smart Remediation"
          organization: "{{ lm_aiops_org }}"
          controller_host: "{{ controller_host }}"
          controller_username: "{{ controller_username }}"
          controller_password: "{{ controller_password }}"
          validate_certs: "{{ controller_verify_ssl }}"
          state: present
      block:
        - name: Ensure BGP Smart Remediation workflow exists
          ansible.controller.workflow_job_template:
            name: "BGP Smart Remediation"
            inventory: "{{ lm_aiops_inventory }}"
            ask_variables_on_launch: true
            state: present

        - name: Ensure workflow node enrich exists
          ansible.controller.workflow_job_template_node:
            identifier: enrich
            unified_job_template: "Enrich with Edwin AI"

        - name: Ensure workflow node bounce exists
          ansible.controller.workflow_job_template_node:
            identifier: bounce
            unified_job_template: "Bounce Interface"

        - name: Ensure workflow node restart exists
          ansible.controller.workflow_job_template_node:
            identifier: restart
            unified_job_template: "Restart Routing"

        - name: Ensure workflow node rollback exists
          ansible.controller.workflow_job_template_node:
            identifier: rollback
            unified_job_template: "Rollback Config"

        - name: Ensure workflow node default_reset exists
          ansible.controller.workflow_job_template_node:
            identifier: default_reset
            unified_job_template: "Reset BGP Session"

        - name: Ensure workflow node report exists
          ansible.controller.workflow_job_template_node:
            identifier: report
            unified_job_template: "Report to LogicMonitor"
            all_parents_must_converge: false

        - name: Link enrich to first remediation and failure fallback
          ansible.controller.workflow_job_template_node:
            identifier: enrich
            unified_job_template: "Enrich with Edwin AI"
            success_nodes:
              - bounce
            failure_nodes:
              - default_reset

        - name: Link bounce to restart
          ansible.controller.workflow_job_template_node:
            identifier: bounce
            unified_job_template: "Bounce Interface"
            success_nodes:
              - restart

        - name: Link restart to rollback
          ansible.controller.workflow_job_template_node:
            identifier: restart
            unified_job_template: "Restart Routing"
            success_nodes:
              - rollback

        - name: Link rollback to report
          ansible.controller.workflow_job_template_node:
            identifier: rollback
