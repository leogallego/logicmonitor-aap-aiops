---
# Bootstrap AAP Controller with LM AIOps demo objects.
#
# Controller connection (first match wins): extra vars, then env.
#   export CONTROLLER_HOST / CONTROLLER_USERNAME / CONTROLLER_PASSWORD
#   ansible-playbook lab-automation/aap_bootstrap_lm_aiops.yml
#
# Or pass a vars file (overrides env):
#   ansible-playbook lab-automation/aap_bootstrap_lm_aiops.yml \
#     -e @lab-automation/credentials.yml
#
# Full run (also creates credentials, Event Stream, workflow template):
#   ansible-playbook lab-automation/aap_bootstrap_lm_aiops.yml \
#     -e @lab-automation/credentials.yml -e full_bootstrap=true
#
# See lab-automation/credentials.yml.example for optional file-based values.

- name: Bootstrap AAP Controller for LM AIOps demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') | default('https://localhost', true) }}"
    controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') | default('admin', true) }}"
    controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') | default('', true) }}"
    controller_verify_ssl: "{{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') | default('false', true) | bool }}"
    full_bootstrap: false

    lm_aiops_org: "Network Ops"
    lm_aiops_project_name: "LM AIOps Solution Guide"
    lm_aiops_project_url: ""
    lm_aiops_inventory: "Network Inventory"
    lm_aiops_credential: "Workshop Credential"
    lm_aiops_ee: "Default execution environment"

  tasks:
    # =================================================================
    # VALIDATION
    # =================================================================

    - name: Validate Controller credentials are provided
      ansible.builtin.assert:
        that:
          - controller_host != "https://localhost"
          - controller_password | length > 0
        fail_msg: >-
          Controller credentials required. Export CONTROLLER_HOST,
          CONTROLLER_USERNAME, and CONTROLLER_PASSWORD, or pass
          -e @lab-automation/credentials.yml (see credentials.yml.example).

    - name: Validate full bootstrap credentials
      ansible.builtin.assert:
        that:
          - lm_company is defined and lm_company != "CHANGEME"
          - lm_bearer_token is defined and lm_bearer_token != "CHANGEME"
          - edwin_portal is defined and edwin_portal != "CHANGEME"
          - edwin_access_id is defined and edwin_access_id != "CHANGEME"
          - edwin_access_key is defined and edwin_access_key != "CHANGEME"
          - eda_hmac_secret is defined and eda_hmac_secret != "CHANGEME"
        fail_msg: >-
          Full bootstrap requires LM, Edwin AI, and EDA credentials.
          Fill in all values in credentials.yml.
      when: full_bootstrap | bool

    # =================================================================
    # CORE BOOTSTRAP — always runs
    # =================================================================

    # --- Organization ---
    - name: Ensure Network Ops organization exists
      ansible.controller.organization:
        name: "{{ lm_aiops_org }}"
        description: "Network Operations — LM AIOps demo"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    # --- Credential Types ---
    - name: Create LM API credential type
      ansible.controller.credential_type:
        name: "LogicMonitor API"
        kind: cloud
        inputs:
          fields:
            - id: lm_company
              label: "LM Company Name"
              type: string
            - id: lm_bearer_token
              label: "LM Bearer Token"
              type: string
              secret: true
          required:
            - lm_company
            - lm_bearer_token
        injectors:
          extra_vars:
            lm_company: !unsafe "{{ lm_company }}"
            lm_bearer_token: !unsafe "{{ lm_bearer_token }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: Create Edwin AI credential type
      ansible.controller.credential_type:
        name: "Edwin AI API"
        kind: cloud
        inputs:
          fields:
            - id: edwin_portal
              label: "Edwin AI Portal"
              type: string
            - id: edwin_access_id
              label: "Edwin AI Access ID"
              type: string
            - id: edwin_access_key
              label: "Edwin AI Access Key"
              type: string
              secret: true
          required:
            - edwin_portal
            - edwin_access_id
            - edwin_access_key
        injectors:
          extra_vars:
            edwin_portal: !unsafe "{{ edwin_portal }}"
            edwin_access_id: !unsafe "{{ edwin_access_id }}"
            edwin_access_key: !unsafe "{{ edwin_access_key }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    # --- Job Templates ---
    - name: "Job template — Reset BGP Session (Crawl)"
      ansible.controller.job_template:
        name: "Reset BGP Session"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/reset_bgp_session.yml"
        inventory: "{{ lm_aiops_inventory }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Enrich with Edwin AI (Walk)"
      ansible.controller.job_template:
        name: "Enrich with Edwin AI"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/enrich_with_edwin_ai.yml"
        inventory: "{{ lm_aiops_inventory }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Bounce Interface (Walk)"
      ansible.controller.job_template:
        name: "Bounce Interface"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/bounce_interface.yml"
        inventory: "{{ lm_aiops_inventory }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Restart Routing (Walk)"
      ansible.controller.job_template:
        name: "Restart Routing"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/restart_routing.yml"
        inventory: "{{ lm_aiops_inventory }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Rollback Config (Walk)"
      ansible.controller.job_template:
        name: "Rollback Config"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/rollback_config.yml"
        inventory: "{{ lm_aiops_inventory }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Escalate to Edwin AI (Run)"
      ansible.controller.job_template:
        name: "Escalate to Edwin AI"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/escalate_to_edwin_ai.yml"
        inventory: "{{ lm_aiops_inventory }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    - name: "Job template — Report to LogicMonitor"
      ansible.controller.job_template:
        name: "Report to LogicMonitor"
        job_type: run
        organization: "{{ lm_aiops_org }}"
        project: "{{ lm_aiops_project_name }}"
        playbook: "playbooks/report_to_logicmonitor.yml"
        inventory: "{{ lm_aiops_inventory }}"
        credentials:
          - "{{ lm_aiops_credential }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"

    # =================================================================
    # FULL BOOTSTRAP — only runs with -e full_bootstrap=true
    # =================================================================

    # --- Credential instances ---
    - name: "Create LM API credential"
      ansible.controller.credential:
        name: "LogicMonitor API"
        organization: "{{ lm_aiops_org }}"
        credential_type: "LogicMonitor API"
        inputs:
          lm_company: "{{ lm_company }}"
          lm_bearer_token: "{{ lm_bearer_token }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Create Edwin AI credential"
      ansible.controller.credential:
        name: "Edwin AI API"
        organization: "{{ lm_aiops_org }}"
        credential_type: "Edwin AI API"
        inputs:
          edwin_portal: "{{ edwin_portal }}"
          edwin_access_id: "{{ edwin_access_id }}"
          edwin_access_key: "{{ edwin_access_key }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    # --- Attach Edwin AI credential to templates that need it ---
    - name: "Attach Edwin AI credential to Enrich with Edwin AI"
      ansible.controller.job_template:
        name: "Enrich with Edwin AI"
        organization: "{{ lm_aiops_org }}"
        credentials:
          - "{{ lm_aiops_credential }}"
          - "Edwin AI API"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Attach Edwin AI credential to Escalate to Edwin AI"
      ansible.controller.job_template:
        name: "Escalate to Edwin AI"
        organization: "{{ lm_aiops_org }}"
        credentials:
          - "{{ lm_aiops_credential }}"
          - "Edwin AI API"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    # --- Attach LM API credential to Report to LogicMonitor ---
    - name: "Attach LM API credential to Report to LogicMonitor"
      ansible.controller.job_template:
        name: "Report to LogicMonitor"
        organization: "{{ lm_aiops_org }}"
        credentials:
          - "{{ lm_aiops_credential }}"
          - "LogicMonitor API"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    # --- EDA Event Stream ---
    - name: "Create EDA HMAC credential for webhook signing"
      ansible.eda.credential:
        name: "LM Webhook HMAC"
        credential_type_name: "HMAC Event Stream"
        organization_name: "{{ lm_aiops_org }}"
        inputs:
          secret: "{{ eda_hmac_secret }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Create LogicMonitor Alerts Event Stream"
      ansible.eda.event_stream:
        name: "LogicMonitor Alerts"
        credential_name: "LM Webhook HMAC"
        organization_name: "{{ lm_aiops_org }}"
        forward_events: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      register: __event_stream
      when: full_bootstrap | bool

    - name: "Display Event Stream URL for LogicMonitor webhook config"
      ansible.builtin.debug:
        msg: >-
          Event Stream created. Configure LogicMonitor webhook with:
          URL: {{ __event_stream.url | default('(check EDA Controller UI)') }}
          HMAC Secret: (the eda_hmac_secret value from your credentials.yml)
        verbosity: 0
      when: full_bootstrap | bool

    # --- Walk: BGP Smart Remediation Workflow ---
    # All three remediation nodes are success children of the enrichment
    # node. Each remediation playbook checks the root_cause artifact and
    # skips itself if the root cause does not match its specialization.
    - name: "Create BGP Smart Remediation workflow template"
      ansible.controller.workflow_job_template:
        name: "BGP Smart Remediation"
        organization: "{{ lm_aiops_org }}"
        inventory: "{{ lm_aiops_inventory }}"
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Workflow node — Enrich with Edwin AI (root)"
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "BGP Smart Remediation"
        organization: "{{ lm_aiops_org }}"
        identifier: "enrich"
        unified_job_template: "Enrich with Edwin AI"
        success_nodes:
          - identifier: "bounce"
          - identifier: "restart"
          - identifier: "rollback"
        failure_nodes:
          - identifier: "default_reset"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Workflow node — Bounce Interface"
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "BGP Smart Remediation"
        organization: "{{ lm_aiops_org }}"
        identifier: "bounce"
        unified_job_template: "Bounce Interface"
        success_nodes:
          - identifier: "report"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Workflow node — Restart Routing"
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "BGP Smart Remediation"
        organization: "{{ lm_aiops_org }}"
        identifier: "restart"
        unified_job_template: "Restart Routing"
        success_nodes:
          - identifier: "report"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Workflow node — Rollback Config"
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "BGP Smart Remediation"
        organization: "{{ lm_aiops_org }}"
        identifier: "rollback"
        unified_job_template: "Rollback Config"
        success_nodes:
          - identifier: "report"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Workflow node — Default BGP Reset (failure fallback)"
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "BGP Smart Remediation"
        organization: "{{ lm_aiops_org }}"
        identifier: "default_reset"
        unified_job_template: "Reset BGP Session"
        success_nodes:
          - identifier: "report"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool

    - name: "Workflow node — Report to LogicMonitor (convergence)"
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "BGP Smart Remediation"
        organization: "{{ lm_aiops_org }}"
        identifier: "report"
        unified_job_template: "Report to LogicMonitor"
        all_parents_must_converge: false
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      when: full_bootstrap | bool
