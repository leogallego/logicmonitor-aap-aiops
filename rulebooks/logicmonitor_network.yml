---
# LogicMonitor AIOps - Network Remediation Rulebook
# Tiered rules: Crawl (deterministic) → Walk (AI-enriched) → Run (agentic catch-all)
#
# Rules are evaluated in order, most specific first.
# Payload contract (not native LM JSON):
#   type   — hardcoded per Custom HTTP integration (bgp_peer_down |
#            bgp_flapping | network_anomaly_unknown). Do not use
#            ##ALERTTYPE## (that token is alert/eventAlert/...).
#   host   — ##HOST##, must match AAP inventory hostname
#   id     — ##INTERNALID## (unique; used as alert_id extra var)
# Templates: lab-automation/lm-webhook/
# Not live-tested: token names and Custom HTTP substitution are from LM
# docs / product knowledge, not a captured webhook. Synthetic tests
# (validation/test_*.sh) already POST this schema. After first live LM
# POST, confirm the rendered body still has type/host/id as above —
# do not rename these keys to native LM field names.

- name: LogicMonitor AIOps - Network Remediation
  hosts: all
  sources:
    # AAP Event Streams (AAP 2.5+): When creating a rulebook activation, map
    # the "LogicMonitor Alerts" Event Stream to this source. AAP replaces the
    # source plugin with its internal pg_listener at activation time — the
    # webhook type below is irrelevant in production.
    # For standalone development/testing without Event Streams, POST directly
    # to http://<eda-host>:5000/logicmonitor.
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    # --- CRAWL: Known alerts, deterministic remediation ---
    - name: BGP peer down - reset session
      condition: event.payload.type == "bgp_peer_down"
      action:
        run_job_template:
          name: "Reset BGP Session"
          organization: "Network Ops"
          job_args:
            extra_vars:
              affected_host: "{{ event.payload.host }}"
              alert_id: "{{ event.payload.id }}"

    # --- WALK: Known alerts, AI-enriched remediation ---
    - name: BGP flapping - smart remediation
      condition: event.payload.type == "bgp_flapping"
      action:
        run_workflow_template:
          name: "BGP Smart Remediation"
          organization: "Network Ops"
          job_args:
            extra_vars:
              affected_host: "{{ event.payload.host }}"
              alert_id: "{{ event.payload.id }}"
              alert_context: "{{ event.payload }}"

    # --- RUN: Unknown alerts, escalate to Edwin AI ---
    - name: Unmatched alert - escalate to Edwin AI
      condition: event.payload.type is defined
      action:
        run_job_template:
          name: "Escalate to Edwin AI"
          organization: "Network Ops"
          job_args:
            extra_vars:
              raw_alert: "{{ event.payload }}"
              source: "eda_catch_all"
